<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northstar</title>
    <!-- The icons are files of the Python app (northstar/web/static), public so the sign-in page has them too. -->
    <link rel="icon" href="/static/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/static/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/static/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <!-- Applies the saved theme before the first paint. A shared file served by the Python app (see
         northstar/web/static/theme.js), because the content security policy allows no inline script. -->
    <script src="/static/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
