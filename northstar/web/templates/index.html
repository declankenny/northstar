<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Northstar</h1>
    <p>Skeleton page. Today is {{ today.isoformat() }}.</p>
    <h2>Account types</h2>
    <table>
      <thead>
        <tr><th>Type</th><th>Class</th><th>Stale after (days)</th><th>Accounts</th></tr>
      </thead>
      <tbody>
        {% for t in types %}
        <tr>
          <td>{{ t.name }}</td><td>{{ t.class_name }}</td>
          <td>{{ t.stale_after_days }}</td><td>{{ t.account_count }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>
</body>
</html>
