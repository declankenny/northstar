<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Northstar</title>
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <main class="card">
    <div class="brand"><i>★</i> Northstar</div>
    <h1>Sign in</h1>

    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email
        <input name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button>Sign in</button>
    </form>
  </main>
</body>
</html>
