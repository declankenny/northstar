<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Northstar</title>
  <link rel="stylesheet" href="/static/login.css">
  <script>
    // Same saved theme as the React app (dark unless the user chose light), applied before first paint.
    try {
      var saved = localStorage.getItem("northstar-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <main class="card">
    <div class="brand"><i>★</i> Northstar</div>
    <h1>Sign in</h1>

    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email
        <input name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button>Sign in</button>
    </form>
  </main>
</body>
</html>
