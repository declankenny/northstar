name: CI

# Runs on every pull request and on pushes to main and the release branches. The three job names below
# are the required status checks of the "Protect main" ruleset, so renaming one means updating the ruleset.
on:
  pull_request:
  push:
    branches: [main, "release/**"]

# Read-only by default. No job needs to write to the repository or any package registry.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag northstar:ci .
      - name: Check that the React app and the migration are inside the image
        # The image installs the package into site-packages, so a missing package-data entry would only
        # show up here, as a missing file, and not in the tests, which run from the source tree.
        run: >
          docker run --rm northstar:ci python -c
          "import pathlib, northstar.web.app as a, northstar.db as d;
          assert (pathlib.Path(a.SPA_DIR) / 'index.html').is_file(), 'the React app is not in the image';
          assert (d.MIGRATIONS_DIR / '0001_initial.sql').is_file(), 'the migration is not in the image';
          print('image ok')"
