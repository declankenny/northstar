name: CI

# Runs on every pull request, on pushes to main and the release branches, and once a week on main. The job
# names below are the required status checks of the "Protect main" ruleset, so renaming one means updating
# the ruleset. The weekly run exists because a new advisory can make the audits fail with no change to the
# code, and that should show up on main, not first on someone's unrelated pull request.
on:
  pull_request:
  workflow_call:      # the release workflow runs all of this again on the tagged commit
  push:
    branches: [main, "release/**"]
  schedule:
    - cron: "23 6 * * 1"

# Read-only by default. No job needs to write to the repository or any package registry.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python dependencies (pip-audit)
        # Resolves the dependencies of pyproject.toml, transitive ones included, and checks each against
        # known advisories. Fails on any finding, because every runtime dependency ships in the image.
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Frontend runtime dependencies (npm audit)
        # Only what ends up in the shipped bundle can fail the build: React and react-dom. The build
        # tools never reach the image.
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend build tools (npm audit, for information)
        # Reported, never failing: a flaw in a build tool cannot affect a running installation.
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version: $version"
          docker build --build-arg VERSION="$version" --tag northstar:ci .
          label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' northstar:ci)
          [ "$label" = "$version" ] || { echo "the image is labelled '$label', pyproject.toml says '$version'"; exit 1; }
      - name: Check that the React app, the migrations and the static files are inside the image
        # The image installs the package into site-packages, so a missing package-data entry would only
        # show up here, as a missing file, and not in the tests, which run from the source tree.
        run: >
          docker run --rm northstar:ci python -c
          "import pathlib, northstar.web.app as a, northstar.db as d;
          assert (pathlib.Path(a.SPA_DIR) / 'index.html').is_file(), 'the React app is not in the image';
          assert (d.MIGRATIONS_DIR / '0001_initial.sql').is_file(), 'the first migration is not in the image';
          assert (d.MIGRATIONS_DIR / '0002_login_attempts.sql').is_file(), 'the second migration is not in the image';
          assert (a.WEB_DIR / 'static' / 'theme.js').is_file(), 'the theme script is not in the image';
          assert (a.WEB_DIR / 'static' / 'login.css').is_file(), 'the sign-in stylesheet is not in the image';
          print('image ok')"
      - name: Start the image and check that it reports healthy and runs as a non-root user
        run: |
          docker run --detach --name northstar-ci northstar:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' northstar-ci)
            echo "health: $status"
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ] || { docker logs northstar-ci; exit 1; }
          user=$(docker exec northstar-ci id -u)
          [ "$user" != 0 ] || { echo "the container runs as root"; exit 1; }
          docker rm --force northstar-ci > /dev/null
      - name: Scan the image for vulnerabilities (Trivy)
        # Fails on a HIGH or CRITICAL finding that has a fix available, in the operating system packages
        # or the Python packages. A finding with no fix yet cannot be acted on, so it is not a failure.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: northstar:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
