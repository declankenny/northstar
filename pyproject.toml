[project]
name = "northstar"
version = "0.6.0rc1"
description = "Self-hosted tracker of household net worth over time."
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    # Checks the signature and claims of the identity provider's ID token (OpenID Connect sign-in). It is what Authlib
    # itself uses for this now, and it is maintained: Authlib's own authlib.jose is deprecated in favour of it.
    "joserfc==1.8.0",
    # The cryptography joserfc runs on. It is pinned here so that Dependabot and pip-audit watch it, because it checks a signature.
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    # Reads CLDR for scripts/generate_locales.py and the test that the migrated locales match it. Development only: the
    # application and its image never read CLDR.
    "babel==2.18.0",
    # The IANA zone database for the tests that use a zone name. Windows has none of its own, and the image has
    # /usr/share/zoneinfo, so the application never needs this package. Development only.
    "tzdata==2026.6",
]

[tool.setuptools]
packages = ["northstar", "northstar.web", "northstar.lists", "northstar.listdefs", "northstar.reports", "northstar.reportdefs"]

[tool.setuptools.package-data]
northstar = ["migrations/*.sql"]
"northstar.web" = ["static/*", "spa/*", "spa/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
