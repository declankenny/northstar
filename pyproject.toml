[project]
name = "northstar"
version = "0.1.0"
description = "Self-hosted tracker of household net worth over time."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["northstar", "northstar.web"]

[tool.setuptools.package-data]
northstar = ["migrations/*.sql"]
"northstar.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
